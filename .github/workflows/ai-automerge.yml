name: AI Auto Publish & Merge

on:
  schedule:
    - cron: '0 3 * * *'   # runs daily
  workflow_dispatch:

jobs:
  merge-ai-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge AI branch into main
        run: |
          git config user.name "ai-bot"
          git config user.email "ai@bot.com"
          git merge origin/ai-content --no-edit || echo "Nothing to merge"

      - name: Push to main
        run: git push origin main
